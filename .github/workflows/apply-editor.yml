name: apply-editor
on:
  push:
    paths:
      - .github/workflows/apply-editor.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: assemble and apply
        run: |
          set -euo pipefail
          out=/tmp/apply_editor.py
          : > "$out"
          for f in \
            applyparts/a0s0 applyparts/a0s1 applyparts/a0s2 applyparts/a0s3 applyparts/a0s4 applyparts/a0s5 applyparts/a0s6 \
            applyparts/a1.py \
            applyparts/a2s0 applyparts/a2s1 applyparts/a2s2 applyparts/a2s3 applyparts/a2s4 applyparts/a2s5 applyparts/a2s6 applyparts/a2s7 \
            applyparts/a3s0 applyparts/a3s1 applyparts/a3s2 applyparts/a3s3 applyparts/a3s4 applyparts/a3s5 applyparts/a3s6 \
            applyparts/a4s0 applyparts/a4s1 applyparts/a4s2 applyparts/a4s3
          do
            cat "$f" >> "$out"
          done
          echo "2aeeca64b0d2050475e1377ba210bfb0a506c1cfa8fe5cd28f852954955acad3  $out" | sha256sum -c
          python3 "$out"
          rm -rf applyparts .github/workflows/apply-editor.yml .github/workflows/ping.yml utf8-probe.txt
          git config user.name "Joham Nunes"
          git config user.email "johamnunes@users.noreply.github.com"
          git add -A
          git commit -m "Wire screenplay editing into the manuscript."
          git push
